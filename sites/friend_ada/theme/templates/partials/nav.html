{% load static i18n %}
<nav class="topnav">
  <div class="topnav-inner">
    <a href="#top" class="brand">V<b>·</b>STRUNGA</a>
    <div class="navlinks" id="navLinks">
      <a href="#profil">{% trans "Profil" %}</a>
      <a href="#zamereni">{% trans "Zaměření" %}</a>
      <a href="#kariera">{% trans "Kariéra" %}</a>
      <a href="#publikace">{% trans "Publikace" %}</a>
      <a href="#prednasky">{% trans "Přednášky" %}</a>
      <a href="#programy">{% trans "Programy" %}</a>
      <a href="#galerie">{% trans "Galerie" %}</a>
      <a href="#kontakt">{% trans "Kontakt" %}</a>
    </div>
    <div class="right-controls">
      <form action="{% url 'set_language' %}" method="post" class="langswitch">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.path }}">
        <button name="language" value="cs" type="submit" class="langbtn{% if LANGUAGE_CODE == 'cs' %} is-active{% endif %}" aria-label="Čeština">🇨🇿<span class="code"> CS</span></button>
        <button name="language" value="en" type="submit" class="langbtn{% if LANGUAGE_CODE == 'en' %} is-active{% endif %}" aria-label="English">🇬🇧<span class="code"> EN</span></button>
        <button name="language" value="fr" type="submit" class="langbtn{% if LANGUAGE_CODE == 'fr' %} is-active{% endif %}" aria-label="Français">🇫🇷<span class="code"> FR</span></button>
      </form>
      <button class="menubtn" id="menuToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="{% trans 'Otevřít menu' %}">{% trans "MENU" %}</button>
      <button class="themebtn" id="themeToggle" type="button" aria-label="{% trans 'Přepnout světlý a tmavý režim' %}">{% trans "SVĚTLÝ REŽIM" %}</button>
    </div>
  </div>
</nav>
