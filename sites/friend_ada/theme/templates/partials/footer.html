{% load i18n %}
<footer>
  <div class="wrap">
    <small>© VLADIMÍR STRUNGA — <span id="yr"></span></small>
    <small>{% trans "GEOLOGIE / MINERALOGIE / GEOCHEMIE" %}</small>
  </div>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  const LABEL_LIGHT = "{% trans 'SVĚTLÝ REŽIM' %}";
  const LABEL_DARK = "{% trans 'TMAVÝ REŽIM' %}";
  const btn = document.getElementById('themeToggle');
  const themeLabelEl = btn.querySelector('.themebtn-label');
  const root = document.documentElement;
  function label(){
    const t = root.getAttribute('data-theme');
    let text;
    if(t === 'dark') text = LABEL_DARK;
    else if(t === 'light') text = LABEL_LIGHT;
    else text = matchMedia('(prefers-color-scheme: dark)').matches ? LABEL_DARK : LABEL_LIGHT;
    themeLabelEl.textContent = text;
  }
  btn.addEventListener('click', () => {
    const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = root.getAttribute('data-theme') || (sysDark ? 'dark' : 'light');
    root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    label();
  });
  label();

  const LABEL_MENU = "{% trans 'MENU' %}";
  const LABEL_CLOSE = "{% trans 'ZAVŘÍT' %}";
  const menuBtn = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');
  const topnavEl = document.querySelector('.topnav');
  const topnavInner = document.querySelector('.topnav-inner');
  const mobileQuery = matchMedia('(max-width: 720px)');

  function setMenu(open){
    navLinks.classList.toggle('is-open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.textContent = open ? LABEL_CLOSE : LABEL_MENU;
  }
  menuBtn.addEventListener('click', () => setMenu(!navLinks.classList.contains('is-open')));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    if (topnavEl.classList.contains('nav-compact')) setMenu(false);
  }));

  // Keep the menu on one line whenever possible; if the links (plus brand and
  // language/theme controls) don't fit — narrow window, or a longer
  // translation — switch to the dropdown menu instead of letting it wrap
  // into an ugly second row.
  function updateNavFit(){
    const wasCompact = topnavEl.classList.contains('nav-compact');
    topnavEl.classList.remove('nav-compact');
    const overflowing = topnavInner.scrollWidth > topnavInner.clientWidth + 1;
    if (overflowing || mobileQuery.matches) {
      topnavEl.classList.add('nav-compact');
    } else if (wasCompact) {
      setMenu(false);
    }
  }
  updateNavFit();
  let navFitRaf = null;
  window.addEventListener('resize', () => {
    if (navFitRaf) cancelAnimationFrame(navFitRaf);
    navFitRaf = requestAnimationFrame(updateNavFit);
  });

  // Gallery lightbox — click a photo to view it full-size with captions and
  // prev/next navigation; works for both the fixed field photos and any
  // photos added later through /admin.
  const galleryImgs = Array.from(document.querySelectorAll('.gallery figure img'));
  const lightbox = document.getElementById('lightbox');
  if (galleryImgs.length && lightbox) {
    const lbImg = lightbox.querySelector('.lb-img');
    const lbCaption = lightbox.querySelector('.lb-caption');
    const lbClose = lightbox.querySelector('.lb-close');
    const lbPrev = lightbox.querySelector('.lb-prev');
    const lbNext = lightbox.querySelector('.lb-next');
    let idx = 0;

    function captionFor(img){
      const fc = img.closest('figure').querySelector('figcaption');
      return fc ? fc.textContent : '';
    }
    function show(i){
      idx = (i + galleryImgs.length) % galleryImgs.length;
      const img = galleryImgs[idx];
      lbImg.src = img.currentSrc || img.src;
      lbImg.alt = img.alt || '';
      lbCaption.textContent = captionFor(img);
    }
    function openLightbox(i){
      show(i);
      lightbox.hidden = false;
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(){
      lightbox.hidden = true;
      document.body.style.overflow = '';
    }
    galleryImgs.forEach((img, i) => {
      img.addEventListener('click', () => openLightbox(i));
    });
    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => show(idx - 1));
    lbNext.addEventListener('click', () => show(idx + 1));
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => {
      if (lightbox.hidden) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
    });
  }
</script>
